<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Lumina Films</title>
  <meta name="description" content="Get in touch with Lumina Films for collaborations, production inquiries, and project pitches." />

  <script>
    document.documentElement.classList.add('js');
    (function () {
      var stored = localStorage.getItem('theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/splitting/dist/splitting.css" />
  <link rel="icon" href="logo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <a href="#top" class="skip-link">Skip to content</a>
  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"><span class="cursor-label">View</span></div>

  <nav class="nav" id="nav">
    <div class="nav-inner">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="navDrawer">
        <span class="menu-lines" aria-hidden="true">
          <span></span>
          <span></span>
        </span>
        <span class="menu-label" id="menuLabel">MENU</span>
      </button>

      <a href="index.html" class="nav-logo">
        <img src="logo/logo.svg" alt="Lumina" style="height:120px;width:90;">
      </a>

      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" aria-pressed="false">
        <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <g class="theme-icon-sun">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </g>
          <g class="theme-icon-moon">
            <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"></path>
          </g>
        </svg>
      </button>
    </div>
  </nav>

  <div class="nav-drawer" id="navDrawer" aria-hidden="true">
    <div class="nav-drawer-inner">
      <a href="services.html" class="nav-drawer-link">Services</a>
      <a href="work.html" class="nav-drawer-link">Work</a>
      <a href="about.html" class="nav-drawer-link">About</a>
      <a href="contact.html" class="nav-drawer-link" aria-current="page">Contact</a>
    </div>
  </div>

  <div id="smooth-wrapper">
    <div id="smooth-content">

      <main id="top">
        <section class="page-section">
          <div class="page-wrap">
            <header class="page-header">
              <h1 class="page-title">Contact</h1>
            </header>

            <div class="contact-grid">
              <div class="contact-info">
                <p class="eyebrow">Get in Touch</p>
                <h2 class="display contact-headline" data-splitting>Let's make something <span class="accent">unforgettable.</span></h2>

                <ul class="contact-details">
                  <li><a href="mailto:hello@lumina.production">hello@lumina.production</a></li>
                  <li>+1 (555) 234-5678</li>
                  <li>Los Angeles, CA</li>
                </ul>

                <div class="social-links">
                  <a href="#" rel="noopener">Instagram</a>
                  <a href="#" rel="noopener">Vimeo</a>
                  <a href="#" rel="noopener">LinkedIn</a>
                </div>
              </div>

              <form class="contact-form" id="contactForm" novalidate>
                <div class="field">
                  <label for="name">Name</label>
                  <input type="text" id="name" name="name" placeholder="Your name" required />
                </div>
                <div class="field">
                  <label for="email">Email</label>
                  <input type="email" id="email" name="email" placeholder="you@company.com" required />
                </div>
                <div class="field">
                  <label for="format">Format</label>
                  <select id="format" name="format" required>
                    <option value="" disabled selected>What format are you making?</option>
                    <option>Short Film</option>
                    <option>Feature Film</option>
                    <option>Documentary</option>
                    <option>Music Video</option>
                    <option>Other</option>
                  </select>
                </div>
                <div class="field">
                  <label for="message">Message</label>
                  <textarea id="message" name="message" rows="4" placeholder="Tell us about your project" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Send Message</button>
                <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
              </form>
            </div>
          </div>
        </section>
      </main>

    </div>
  </div>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p></p>
      <span class="footer-mark"></span>
      <div class="footer-links">
        <a href="#"></a>
        <a href="#"></a>
      </div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/splitting/dist/splitting.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
